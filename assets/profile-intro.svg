<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">杨仕明 · Shiming Yang — AI product and systems builder</title>
  <desc id="desc">An animated pipeline transforms real-world signals into context, knowledge, agents, and useful products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.52" stop-color="#08172d"/>
      <stop offset="1" stop-color="#120d2b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d9ff"/>
      <stop offset="0.5" stop-color="#6d8cff"/>
      <stop offset="1" stop-color="#c377ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4ddcff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4ddcff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#66bfff" stroke-opacity=".065"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.7px; fill: #8ea9c8; }
      .node-title { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.2px; fill: #dff8ff; }
      .node-sub { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7894b8; }
      .flow-line { stroke-dasharray: 8 12; animation: stream 1.7s linear infinite; }
      .node { animation: breathe 4s ease-in-out infinite; }
      .n2 { animation-delay: -.8s; } .n3 { animation-delay: -1.6s; } .n4 { animation-delay: -2.4s; } .n5 { animation-delay: -3.2s; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes stream { to { stroke-dashoffset: -20; } }
      @keyframes breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes scan { 0%, 100% { transform: translateX(-60px); opacity: 0; } 10%, 90% { opacity: .55; } 50% { transform: translateX(1040px); opacity: .35; } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow-line, .node, .scan, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="255" rx="530" ry="205" fill="url(#glow)" opacity=".55"/>
  <rect class="scan" x="60" y="0" width="2" height="430" fill="#66e7ff" opacity=".35" filter="url(#softGlow)"/>

  <g transform="translate(72 58)">
    <text class="label" x="0" y="0">SHIMING.Y / SYSTEM BUILDER</text>
    <circle cx="890" cy="-5" r="5" fill="#46e1ff" filter="url(#softGlow)"/>
    <text class="label" x="1056" y="0" text-anchor="end">ONLINE · SHENZHEN</text>

    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="760" fill="#f3fbff">杨仕明</text>
    <text x="180" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="300" fill="#5d789c">/</text>
    <text x="215" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="650" fill="#b9c9ff">SHIMING YANG</text>
    <rect class="cursor" x="570" y="39" width="4" height="48" rx="2" fill="#4de2ff"/>

    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#9eb4cf">Turning messy real-world signals into calm, dependable software.</text>
  </g>

  <g transform="translate(68 244)">
    <path class="flow-line" d="M98 50H982" fill="none" stroke="url(#flow)" stroke-width="2.5" opacity=".82"/>

    <g class="node n1" transform="translate(0)">
      <rect width="196" height="100" rx="18" fill="#0a1b31" stroke="#21d6ff" stroke-opacity=".55"/>
      <circle cx="24" cy="25" r="6" fill="#21d6ff" filter="url(#softGlow)"/>
      <text class="node-title" x="42" y="30">SIGNALS</text>
      <text class="node-sub" x="20" y="62">meetings · users</text>
      <text class="node-sub" x="20" y="80">audio · workflows</text>
    </g>
    <g class="node n2" transform="translate(216)">
      <rect width="196" height="100" rx="18" fill="#0b1b35" stroke="#45bfff" stroke-opacity=".55"/>
      <circle cx="24" cy="25" r="6" fill="#45bfff" filter="url(#softGlow)"/>
      <text class="node-title" x="42" y="30">CONTEXT</text>
      <text class="node-sub" x="20" y="62">identity · evidence</text>
      <text class="node-sub" x="20" y="80">permissions · links</text>
    </g>
    <g class="node n3" transform="translate(432)">
      <rect width="196" height="100" rx="18" fill="#101a3a" stroke="#718cff" stroke-opacity=".6"/>
      <circle cx="24" cy="25" r="6" fill="#718cff" filter="url(#softGlow)"/>
      <text class="node-title" x="42" y="30">KNOWLEDGE</text>
      <text class="node-sub" x="20" y="62">contracts · structure</text>
      <text class="node-sub" x="20" y="80">memory · insight</text>
    </g>
    <g class="node n4" transform="translate(648)">
      <rect width="196" height="100" rx="18" fill="#17163b" stroke="#9d7cff" stroke-opacity=".6"/>
      <circle cx="24" cy="25" r="6" fill="#9d7cff" filter="url(#softGlow)"/>
      <text class="node-title" x="42" y="30">AI / AGENTS</text>
      <text class="node-sub" x="20" y="62">tools · reasoning</text>
      <text class="node-sub" x="20" y="80">automation · access</text>
    </g>
    <g class="node n5" transform="translate(864)">
      <rect width="196" height="100" rx="18" fill="#211438" stroke="#ca78ff" stroke-opacity=".65"/>
      <circle cx="24" cy="25" r="6" fill="#ca78ff" filter="url(#softGlow)"/>
      <text class="node-title" x="42" y="30">PRODUCTS</text>
      <text class="node-sub" x="20" y="62">clear · useful</text>
      <text class="node-sub" x="20" y="80">tested · dependable</text>
    </g>
  </g>

  <text x="72" y="394" class="label">NOVE · CREATOR TOOLS · DEVELOPER EXPERIENCE · NATIVE INTEGRATIONS</text>
  <text x="1128" y="394" class="label" text-anchor="end">BUILD → VERIFY → SHIP</text>
</svg>
